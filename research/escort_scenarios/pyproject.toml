[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "escort-scenarios"
version = "0.1.0"
description = "Offline deterministic ground-truth pedestrian scenarios"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[project.scripts]
escort-scenarios = "escort_scenarios.__main__:main"

[tool.setuptools.packages.find]
include = ["escort_scenarios*"]
