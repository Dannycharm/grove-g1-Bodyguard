schema_version: 1
environment_config: stage1.yaml
split_config: stage1_splits.json
device: cpu
torch_threads: 1
workers: 1
ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi:
      - 128
      - 128
      vf:
      - 128
      - 128
checkpoint_interval: 2048
validation_interval: 10000
promotion:
  overall_success: 0.9
  per_family_success: 0.8
  max_mean_formation_error_m: 0.75
  min_mean_accompanied_fraction: 0.6
  consecutive_rounds: 2
reward_version: legacy_v1
